# Linux VM that runs the 32-bit x86 SCE psp-gcc binaries under qemu-user.
# Only the repo is shared with the VM, at the same path as on the host.
minimumLimaVersion: 2.0.0
vmType: vz
arch: aarch64
cpus: 4
memory: 4GiB
disk: 20GiB
images:
- location: "https://cloud.debian.org/images/cloud/bookworm/20260923-2610/debian-12-genericcloud-arm64-20260923-2610.qcow2"
  arch: "aarch64"
  digest: "sha512:89a752d5c7d8e88bee39a57d88d496cca574f7d1e8df5df7a169825435f99feb11ed13ab27ec7bee96fe1584be4ff9479358fbca6cc859efa109f4aba18724c8"
mountType: virtiofs
mounts:
- location: "/Users/jeffreywilbur/projects/strutb/ridgeracerpsp"
  mountPoint: "/Users/jeffreywilbur/projects/strutb/ridgeracerpsp"
  writable: true
containerd:
  system: false
  user: false
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eux
    dpkg --add-architecture i386
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-user-static binfmt-support libc6:i386 make
